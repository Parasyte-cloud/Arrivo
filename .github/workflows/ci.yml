name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arrivo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Must contain "localhost": db/db.js only turns SSL off for such URLs.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/arrivo_test
      JWT_SECRET: ci-test-secret
    defaults:
      run:
        working-directory: arrivo-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arrivo-backend/package-lock.json
      - run: npm ci
      - name: Create the schema
        run: node -e "require('./db/db').ready.then(() => process.exit(0)).catch((e) => { console.error(e); process.exit(1); })"
      - name: Unit and integration tests
        run: npm run test:integration

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arrivo-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: arrivo-admin/package-lock.json
      - run: npm ci
      - name: Production build
        env:
          VITE_API_BASE_URL: https://api.example.test
        run: npm run build
